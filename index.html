<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanover College — Academic Catalog</title>
    <meta http-equiv="refresh" content="0; url=apps/browse/" />
    <script>
      ;(function () {
        var path = window.location.pathname
        var hash = window.location.hash
        if (path && !path.endsWith('/')) window.location.replace(path + '/' + hash)
        else window.location.replace('apps/browse/' + hash)
      })()
    </script>
  </head>
  <body>
    <p>Redirecting to the <a href="apps/browse/">program catalog</a>…</p>
  </body>
</html>
