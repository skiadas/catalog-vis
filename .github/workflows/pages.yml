name: Publish static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install JS tooling
        run: npm ci

      - name: Build apps
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble static site root
        run: |
          mkdir -p _site/apps
          cp -r dist/browse dist/planner dist/schedule _site/apps/
          cp index.html config.json majors.json requirements_parsed.json core_requirements.json _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5