name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install JS tooling
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build apps
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Compile Python scripts
        run: python3 -m compileall -q -x "node_modules|/\.git/" .

      - name: Check Python formatting
        run: python3 -m black --check .

      - name: Data integrity
        run: npm run test:data

      - name: Validate catalog data contract
        run: npm run validate:catalog
